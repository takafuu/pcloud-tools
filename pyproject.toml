[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pcloud-tools"
version = "0.1.1"
description = "Personal, preview-first pCloud CLI suite built around rclone."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "rich>=13.7",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
pcloud-manager = "pcloud_tools.cli:main"
pcloud-tools = "pcloud_tools.cli:main"
pcloud-pushd = "pcloud_tools.cli_service_daemon:main_pushd"
pcloud-diffd = "pcloud_tools.cli_service_daemon:main_diffd"
pcloud-archive = "pcloud_tools.pcloud_archive:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pcloud_tools"]

[tool.hatch.build.targets.wheel.force-include]
"docs/spec/利用ガイド.md" = "pcloud_tools/share/docs/pcloud-manager/利用ガイド.md"
"docs/spec/技術仕様.md" = "pcloud_tools/share/docs/pcloud-manager/技術仕様.md"
"docs/spec/AI向け概要.md" = "pcloud_tools/share/docs/pcloud-manager/AI向け概要.md"
"docs/commands/pcloud-archive/利用ガイド.md" = "pcloud_tools/share/docs/pcloud-archive/利用ガイド.md"
"docs/commands/pcloud-archive/技術仕様.md" = "pcloud_tools/share/docs/pcloud-archive/技術仕様.md"
"docs/commands/pcloud-archive/AI向け概要.md" = "pcloud_tools/share/docs/pcloud-archive/AI向け概要.md"
"docs/man" = "pcloud_tools/share/man/man1"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pcloud-tools"
version = "0.1.0"
description = "Python-centered successor to the pcloud-manager shell monolith."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.7",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
pcloud-tools = "pcloud_tools.cli:main"
pcloud-pushd = "pcloud_tools.cli_service_daemon:main_pushd"
pcloud-diffd = "pcloud_tools.cli_service_daemon:main_diffd"
pcloud-archive = "pcloud_tools.pcloud_archive:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pcloud_tools"]

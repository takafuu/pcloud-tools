name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.7"

      - name: Verify tag matches package version
        run: |
          package_version=$(PYTHONPATH=src python3 -c 'from pcloud_tools import __version__; print(__version__)')
          test "v${package_version}" = "${GITHUB_REF_NAME}"

      - name: Run tests
        run: uv run --extra test pytest -q

      - name: Build release bundle
        run: ./scripts/build-release-bundle.sh

      - name: Upload verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pcloud-tools-release-assets
          path: |
            dist/pcloud-tools-install.tar.gz
            dist/pcloud-tools-install.tar.gz.sha256
            dist/pcloud_tools-*.whl
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: test-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pcloud-tools-release-assets
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/pcloud-tools-install.tar.gz \
            dist/pcloud-tools-install.tar.gz.sha256 \
            dist/pcloud_tools-*.whl \
            --generate-notes \
            --verify-tag
